<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>#30DayMapChallenge 2026 · Nathan Franklin</title>
  <meta name="description" content="Nathan Franklin's maps for the #30DayMapChallenge, November 2026.">
  <!-- Visit counts (GoatCounter: no cookies, ignores localhost). -->
  <script data-goatcounter="https://nathanfranklin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <style>
    :root {
      --surface: #0b1622;
      --card: #121f2d;
      --line: #2c3a4a;
      --text: #e8eef4;
      --muted: #9aaabd;
      --link: #8fc1ff;
    }
    * { box-sizing: border-box; }
    html { font-size: clamp(16px, 0.45vw + 10.25px, 20px); }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
      line-height: 1.55;
    }
    main { max-width: 60rem; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 0.5rem; }
    .intro { color: var(--muted); margin: 0 0 2.5rem; }
    a { color: var(--link); }

    .days { list-style: none; padding: 0; margin: 0; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); }
    .day a {
      display: block;
      height: 100%;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .day a:hover, .day a:focus-visible { border-color: var(--link); }
    .day a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .day img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; border-bottom: 1px solid var(--line); }
    .day .body { padding: 0.875rem 1rem 1rem; }
    .day .theme { color: var(--muted); font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 0.25rem; }
    .day h2 { font-size: 1.125rem; line-height: 1.3; margin: 0 0 0.375rem; }
    .day p { margin: 0; color: var(--muted); font-size: 0.9375rem; }

    footer { margin-top: 3rem; color: var(--muted); font-size: 0.875rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>#30DayMapChallenge 2026</h1>
    <p class="intro">My maps for the <a href="https://30daymapchallenge.com/">#30DayMapChallenge</a>, November 2026.</p>

    <ul class="days">
      <li class="day">
        <a href="day01/">
          <img src="day01/preview.png" alt="World map of DesignSafe published project locations, with green rings marking the 37 public Hazmapper maps." width="1200" height="630">
          <div class="body">
            <p class="theme">Day 1 · Points</p>
            <h2>DesignSafe’s published projects, mapped</h2>
            <p>Where DesignSafe’s published natural hazards projects happened, and a walk through every public Hazmapper map.</p>
          </div>
        </a>
      </li>
    </ul>

    <footer>
      <a href="https://github.com/nathanfranklin/30daymapchallenge-2026">Code on GitHub</a>
    </footer>
  </main>
</body>
</html>
